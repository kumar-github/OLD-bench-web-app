spring:
  application:
    name: bench-match-webapp

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demand_supply_mapping_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

server:
  port: ${PORT:8080}

  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate must never auto-alter the
      # tables that supply_overrides/demand_candidate_decisions/etc. FK
      # against.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

vaadin:
  # Vaadin's production/dev-mode switch; leave dev tooling on until a
  # deployment pipeline exists.
  launch-browser: false
  allowed-packages:
    - com.vaadin
    - org.vaadin
    - com.example
    - com.flowingcode


